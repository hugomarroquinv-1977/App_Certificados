<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>{% block titulo %}Academia Horizonte{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
</head>
<body>
  <header class="encabezado">
    <div class="encabezado-texto">
      <h1>Academia Horizonte</h1>
      <p>Certificados por cohorte</p>
    </div>
    {% if session.get("correo") %}
    <div class="usuario-sesion">
      <span class="usuario-correo">{{ session.get("correo") }}</span>
      <span class="usuario-rol rol-{{ session.get('rol') }}">{{ session.get("rol") }}</span>
      <a href="{{ url_for('salir') }}" class="boton-salir">Salir</a>
    </div>
    {% endif %}
  </header>
  <main>
    {% block contenido %}{% endblock %}
  </main>
</body>
</html>
